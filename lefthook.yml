pre-commit:
  commands:
    check:
      glob: "*.{js,ts,cjs,mjs,d.cts,d.mts,jsx,tsx,json,jsonc}"
      run: npx @biomejs/biome check --write --no-errors-on-unmatched --files-ignore-unknown=true --colors=off {staged_files}
      stage_fixed: true
pre-push:
  commands:
    ensure-build:
      run: pnpm build
    test:
      run: pnpm test
    coverage:
      run: pnpm --filter ./packages/use-captcha-react test:coverage
